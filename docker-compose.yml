services:
  postgres:
    image: postgres:17-alpine
    container_name: garage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-garage}
      POSTGRES_USER: ${DB_USERNAME:-garage}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-garage} -d ${DB_DATABASE:-garage}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - garage-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: garage-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@garage.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - garage-network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  garage-network:
    driver: bridge
